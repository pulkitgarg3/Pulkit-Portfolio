    <style>

        :root{
            --navy:#0D1F35;
            --amber:#D48A0A;
            --bg:#F7F9FB;
            --text:#1A2332;
            --muted:#5A6B7A;
            --white:#ffffff;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:"DM Sans",sans-serif;
            background:var(--bg);
            color:var(--text);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            text-align:center;
            padding:32px;
        }

        .card{
            max-width:700px;
            background:white;
            padding:60px;
            border-radius:18px;
            box-shadow:0 10px 35px rgba(0,0,0,.08);
        }

        h1{
            font-family:"Fraunces",serif;
            font-size:72px;
            color:var(--navy);
            margin-bottom:10px;
        }

        h2{
            font-family:"Fraunces",serif;
            font-size:34px;
            margin-bottom:20px;
        }

        p{
            color:var(--muted);
            font-size:18px;
            line-height:1.8;
            margin-bottom:40px;
        }

        .buttons{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:16px;
        }

        a{
            text-decoration:none;
            padding:14px 28px;
            border-radius:10px;
            transition:.25s;
            font-weight:600;
        }

        .primary{
            background:var(--navy);
            color:white;
        }

        .primary:hover{
            background:#16345A;
        }

        .secondary{
            border:2px solid var(--navy);
            color:var(--navy);
        }

        .secondary:hover{
            background:var(--navy);
            color:white;
        }

        @media(max-width:600px){

            .card{
                padding:40px 28px;
            }

            h1{
                font-size:56px;
            }

            h2{
                font-size:28px;
            }

            p{
                font-size:16px;
            }

        }

    </style>

</head>
